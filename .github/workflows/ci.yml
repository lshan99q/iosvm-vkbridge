# SPDX-License-Identifier: MIT
name: ci

on:
  push:
  pull_request:

jobs:
  lavapipe:
    name: build, unit tests and GPU probe on lavapipe
    runs-on: ubuntu-24.04
    env:
      # The loader's current variable; VK_ICD_FILENAMES is the deprecated alias.
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev mesa-vulkan-drivers clang-format

      # A missing ICD manifest must fail, never silently skip the GPU probe. The
      # probe also exits non-zero when VK_DRIVER_FILES names a missing file.
      - name: Require the lavapipe ICD
        run: test -f "$VK_DRIVER_FILES"

      - name: Build
        run: make

      - name: Unit tests and GPU probe
        run: make test

      # make test already fails when the probe fails; this step makes the
      # required output explicit and checks it line by line.
      - name: Require all eight probe checks on lavapipe
        run: |
          set -euo pipefail
          ./build/vkbridge-probe --screenshot /tmp/vkbridge-ci.png | tee /tmp/vkbridge-probe.txt
          ok_lines=$(grep -c '^\[ok\]' /tmp/vkbridge-probe.txt)
          if [ "$ok_lines" -ne 8 ]; then
            echo "expected 8 [ok] lines, got $ok_lines" >&2
            exit 1
          fi
          if grep -q '^\[FAIL\]' /tmp/vkbridge-probe.txt; then
            echo "probe reported a failure" >&2
            exit 1
          fi
          # The device-side oracle must have accepted the blit checks and the frame.
          if [ "$(grep -c 'device checksum ok' /tmp/vkbridge-probe.txt)" -ne 3 ]; then
            echo "expected three device-checksum lines (copy, fill, screenshot)" >&2
            exit 1
          fi
          test -s /tmp/vkbridge-ci.png
          file /tmp/vkbridge-ci.png | grep -q 'PNG image data, 320 x 200'

      - name: clang-format
        run: make format-check

      - name: ASan and UBSan unit tests
        run: make test-asan

      # A wrong ICD path must be an error, not a skipped pass. Run the probe with a
      # deliberately broken environment and require a non-zero exit.
      - name: A missing ICD fails instead of skipping
        run: |
          if VK_DRIVER_FILES=/nonexistent ./build/vkbridge-probe --device-check; then
            echo "the probe accepted a nonexistent VK_DRIVER_FILES" >&2
            exit 1
          fi
